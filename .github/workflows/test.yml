name: Tests

on:
  push:
    branches: [main, improve-morph-blending, browser-morph-v16, morph-scan-diagnostics-2026-10-10, morph-face-isolation-2026-10-10, morph-robust-handheld-2026-10-10]
  pull_request:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
